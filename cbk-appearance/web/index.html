<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBK Appearance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">CBK</div>
        <div>
          <div class="eyebrow">Caracter Editor</div>
          <h1>Appearance Studio</h1>
        </div>
      </div>

      <nav class="steps" id="steps"></nav>

      <div class="quick">
        <button data-camera="full">Full</button>
        <button data-camera="head">Head</button>
        <button data-camera="torso">Torso</button>
        <button data-camera="feet">Feet</button>
        <button data-camera="left">Left</button>
        <button data-camera="right">Right</button>
      </div>

      <div class="quick">
        <button id="rotateRight">↻ Rotate L</button>
        <button id="rotateLeft">Rotate R ↺</button>
      </div>

      <div class="quick">
        <button id="zoomIn">Zoom In</button>
        <button id="zoomOut">Zoom Out</button>
      </div>

      <div id="status" class="status">Thanks For Using CBK!</div>

      <div class="footer-actions">
        <button class="ghost" id="cancelBtn">Cancel</button>
        <button class="primary" id="saveBtn">Save</button>
      </div>
    </aside>

    <main class="panel">
      <header class="panel-header">
        <div>
          <div class="eyebrow" id="sectionEyebrow">Editor</div>
          <h2 id="sectionTitle">Appearance</h2>
        </div>
        <div class="pill">Live Editor</div>
      </header>

      <section class="grid" id="controls"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
